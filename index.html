<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledger — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <div class="brand-mark-small">£</div>
      <div class="brand">Ledger</div>
    </div>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="sign-out-btn">Sign out</button>
    </div>
  </header>

  <main class="page">

    <div class="summary-card">
      <div>
        <p class="summary-label">Total spent this month</p>
        <p id="total-month" class="summary-total">£0.00</p>
      </div>
      <i class="ti ti-report-money summary-icon" aria-hidden="true"></i>
    </div>

    <div class="layout">

      <section class="card">
        <h2><i class="ti ti-plus card-icon" aria-hidden="true"></i>Add an expense</h2>
        <form id="expense-form">
          <label>
            Amount (£)
            <input type="number" id="amount" step="0.01" min="0" required />
          </label>

          <label>
            Category
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Subscriptions">Subscriptions</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Date
            <input type="date" id="date" required />
          </label>

          <label>
            Note (optional)
            <input type="text" id="note" placeholder="e.g. coffee with mates" maxlength="40" />
          </label>

          <button type="submit" id="expense-submit-btn">Add expense</button>
          <button type="button" id="cancel-edit-btn" style="display: none;">Cancel</button>
        </form>
      </section>

      <section class="card">
        <h2><i class="ti ti-list card-icon" aria-hidden="true"></i>Recent expenses</h2>
        <p id="empty-state">No expenses yet — add your first one.</p>
        <ul id="expense-list"></ul>
      </section>

    </div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/expenses.js"></script>
</body>
</html>
