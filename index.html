<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledger — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <div class="brand-mark-small">£</div>
      <div class="brand">Ledger</div>
    </div>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="sign-out-btn">Sign out</button>
    </div>
  </header>

  <main class="page">

    <div class="summary-card">
      <div class="summary-left">
        <div class="month-nav">
          <button type="button" id="prev-month-btn" aria-label="Previous month"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>

          <div class="month-picker">
            <button type="button" id="month-picker-btn">
              <span id="current-month-label">August 2026</span>
              <i class="ti ti-chevron-down" aria-hidden="true"></i>
            </button>

            <div class="month-picker-panel" id="month-picker-panel" hidden>
              <div class="picker-year-row">
                <button type="button" id="picker-prev-year" aria-label="Previous year"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
                <span id="picker-year-label">2026</span>
                <button type="button" id="picker-next-year" aria-label="Next year"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
              </div>
              <div class="picker-month-grid" id="picker-month-grid"></div>
              <button type="button" id="picker-today-btn" class="picker-today-btn">Jump to this month</button>
            </div>
          </div>

          <button type="button" id="next-month-btn" aria-label="Next month"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        </div>
        <p id="total-month" class="summary-total">£0.00</p>
      </div>
      <i class="ti ti-report-money summary-icon" aria-hidden="true"></i>
    </div>

    <div class="layout">

      <section class="card">
        <div class="card-header"><i class="ti ti-plus" aria-hidden="true"></i>Add an expense</div>
        <div class="card-body">
          <form id="expense-form">
            <label>
              Amount (£)
              <input type="number" id="amount" step="0.01" min="0" required />
            </label>

            <label>
              Category
              <select id="category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Subscriptions">Subscriptions</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label>
              Date
              <input type="date" id="date" required />
            </label>

            <label>
              Note (optional)
              <input type="text" id="note" placeholder="e.g. coffee with mates" maxlength="40" />
            </label>

            <button type="submit" id="expense-submit-btn">Add expense</button>
            <button type="button" id="cancel-edit-btn" style="display: none;">Cancel</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-header"><i class="ti ti-list" aria-hidden="true"></i>Recent expenses</div>
        <div class="card-body">
          <p id="empty-state">No expenses this month.</p>
          <ul id="expense-list"></ul>
        </div>
      </section>

    </div>

    <section class="card charts-card">
      <div class="card-header"><i class="ti ti-chart-bar" aria-hidden="true"></i>Insights</div>
      <div class="card-body">
        <h3 class="chart-subheading"><i class="ti ti-chart-pie chart-subheading-icon" aria-hidden="true"></i>Spend by category</h3>
        <div id="category-legend" class="chart-legend"></div>
        <div class="chart-wrap">
          <canvas id="category-chart" role="img" aria-label="Pie chart of spend by category for the selected month"></canvas>
        </div>

        <h3 class="chart-subheading chart-subheading-second"><i class="ti ti-chart-line chart-subheading-icon" aria-hidden="true"></i>Spend over time</h3>
        <div class="chart-wrap">
          <canvas id="trend-chart" role="img" aria-label="Line chart of daily spend across the selected month"></canvas>
        </div>
      </div>
    </section>

  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/expenses.js"></script>
</body>
</html>
